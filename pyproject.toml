[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monicon"
version = "0.1.0.101"
description = "Modern Linux system tray application for controlling MSI gaming monitors with global keybindings"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [
    { name = "Monicon Contributors" }
]

dependencies = [
    "hid>=1.0.6",              # hidapi Python bindings for HID communication
    "pynput>=1.7",             # Global keyboard shortcut capture (cross-DE)
    "PyQt6>=6.0",              # System tray GUI (cross-platform, cross-DE)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/lISimoHayhaIl/Monicon"
Issues = "https://github.com/lISimoHayhaIl/Monicon/issues"

[project.scripts]
monicon = "msi_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["msi_monitor*"]

[tool.setuptools.package-data]
# Ship the JSON monitor definitions and the tray/app icon assets inside the wheel.
"msi_monitor.monitors" = ["*.json"]
"msi_monitor.gui" = ["assets/*.svg", "assets/*.png"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
